[project]
name = "climbing-efficiency-analyzer"
version = "0.26.0"
description = "Local climbing video measurement viewer for Windows and macOS"
requires-python = "==3.12.11"
dependencies = [
  "numpy==1.26.4",
  "av==15.0.0",
  "pyside6==6.9.2",
  "jsonschema==4.25.1",
  "pytest==8.4.2",
  "psutil==7.0.0",
  "pillow==12.3.0",
  "reportlab==4.4.9",
]

[project.optional-dependencies]
analysis = [
  "torch==2.8.0; sys_platform == 'win32'",
  "torchvision==0.23.0; sys_platform == 'win32'",
  "opencv-python==4.11.0.86; sys_platform == 'win32'",
  "transformers==4.55.4; sys_platform == 'win32'",
  "ultralytics==8.3.199; sys_platform == 'win32'",
  "mediapipe==0.10.21; sys_platform == 'win32'",
]

[dependency-groups]
# Installer builds only: uv sync --locked --group build
build = ["pyinstaller==6.22.3"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
