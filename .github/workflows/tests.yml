name: Viewer tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      UV_NO_PROGRESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true
      - run: uv python install 3.12.11
      - run: uv sync --locked
      - run: uv run --no-sync python -m pytest viewer -q
      # Synthetic fixtures only. No videos, labels, weights or local artifacts.
